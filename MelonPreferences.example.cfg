# Example only: merge these keys into your existing [JoinLeaveAlerts] section.
# Keep your real webhook URL and managed message ID/rosters; do not overwrite them.
[JoinLeaveAlerts]
DiscordDeliveryMode = "StatusEmbed"
# DiscordWebhookUrl = "YOUR_EXISTING_DISCORD_WEBHOOK_URL"

# Embed heading
StatusEmbedShowTitle = true
# Online/offline indicator, independent of player count
StatusEmbedShowServerStatus = true
# Most recent join, leave, rejection or server lifecycle event
StatusEmbedShowActivity = true
# Show how long ago the latest event happened (independent of refresh time).
StatusEmbedShowActivityAge = true
# Online player names and count
StatusEmbedShowOnlinePlayers = true
# Known offline player names and count
StatusEmbedShowOfflinePlayers = true
# Time since the server became ready; freezes when stopped
StatusEmbedShowUptime = true
# Discord timestamp for the last refresh
StatusEmbedShowTimestamp = true
# Custom footer text
StatusEmbedShowFooter = true
# Custom server description
StatusEmbedShowDescription = true
# Website and Discord invite links
StatusEmbedShowLinks = true
# Large banner image
StatusEmbedShowImage = true
# Small logo thumbnail
StatusEmbedShowThumbnail = true
# Online/offline accent color
StatusEmbedShowColor = true

# Empty URLs/descriptions omit those items even when their Show setting is true.
StatusEmbedTitle = "ATT Player Activity"
StatusEmbedDescription = ""
StatusEmbedImageUrl = ""
StatusEmbedThumbnailUrl = ""
StatusEmbedWebsiteUrl = ""
StatusEmbedInviteUrl = ""
StatusEmbedFooterText = "Last updated"
StatusEmbedOnlineColor = "#57F287"
StatusEmbedOfflineColor = "#ED4245"

StatusEmbedRefreshSeconds = 60.0
# Optional crash-monitor heartbeat; blank disables writing the file.
StatusEmbedHeartbeatPath = ""
